name: Build and release Windows app

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and build Windows EXE
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install pinned build dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run regression checks and build standalone EXE
        shell: pwsh
        run: ./build.ps1 -SkipInstall -PythonExecutable (Get-Command python).Source

      - name: Smoke-test the packaged executable
        run: python tests/smoke_exe.py dist/MaterialConverter.exe

      - name: Package app and licence notices
        run: python scripts/package_release.py

      - name: Save release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-release
          path: release/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub release
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download tested build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-release
          path: release

      - name: Publish versioned release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="build-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:7}"
          cat > release-notes.md <<EOF
          Automated Windows build from commit ${GITHUB_SHA}.

          Download **MaterialConverter-Windows.zip**, extract it, and run **MaterialConverter.exe**. Python is bundled. An installed CRYENGINE Resource Compiler is required for DDS compilation.

          Includes dependency licence notices and a SHA-256 checksum. Regression tests and a packaged-EXE conversion smoke test passed. CI tests do not include CRYENGINE DDS compilation or Sandbox rendering.
          EOF
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release/* --clobber
          else
            gh release create "$tag" release/* \
              --target "$GITHUB_SHA" \
              --title "Windows build ${GITHUB_RUN_NUMBER}" \
              --notes-file release-notes.md \
              --latest
          fi
